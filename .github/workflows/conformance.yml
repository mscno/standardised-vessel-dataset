name: Conformance

on:
  pull_request:
    paths:
      - 'conformance/**'
      - 'src/go/**'
      - 'src/dotnet/**'
      - 'src/elixir/**'
      - '.github/workflows/conformance.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'conformance/**'
      - 'src/go/**'
      - 'src/dotnet/**'
      - 'src/elixir/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

jobs:
  parity:
    name: Parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'

      - name: Install Elixir dependencies
        working-directory: src/elixir/svd
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run conformance parity
        run: python3 conformance/runner.py --adapters go,dotnet,elixir

  benchmark:
    name: Benchmark
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.0'
          elixir-version: '1.17.3'

      - name: Install Elixir dependencies
        working-directory: src/elixir/svd
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run benchmark suite
        run: python3 conformance/benchmark.py --adapters go,dotnet,elixir --iterations 200
