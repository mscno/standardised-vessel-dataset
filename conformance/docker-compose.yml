services:
  conformance:
    build:
      context: ..
      dockerfile: conformance/Dockerfile
    working_dir: /workspace
    command: ["python3", "conformance/runner.py", "--adapters", "go,dotnet,rust"]

  benchmark:
    build:
      context: ..
      dockerfile: conformance/Dockerfile
    working_dir: /workspace
    command: ["python3", "conformance/benchmark.py", "--adapters", "go,dotnet,rust", "--iterations", "200"]
